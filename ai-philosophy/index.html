<meta name="twitter:image" content="https://rmaruy3.github.io/ai-philosophy/assets/og.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --fg:#1A1A1A;
  --sub:#6B6B6B;
  --rule:#E4E8EB;
  --accent:#146390;
  --accent-light:#4FB3E8;
  --part-tech:#1B527A;
  --part-phil:#524877;
  --part-society:#1C6259;
  --part-overview:#545454;
  --part-tech-phil:#3A5A80;
  --part-society-phil:#3A6070;
  --sans:'Noto Sans JP', sans-serif;
  --label:'Inter', sans-serif;
  --maxw:42rem;
}
*{box-sizing:border-box;}
html{scroll-behavior:auto;}
@media (prefers-reduced-motion: no-preference){
  html{scroll-behavior:smooth;}
}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:var(--sans);
  font-weight:300;
  font-size:16px;
  line-height:2.0;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
@media (min-width:600px){ body{font-size:17px;} }
h1,h2,h3,h4{
  font-family:var(--sans);
  font-weight:700;
  letter-spacing:0.01em;
  line-height:1.5;
  margin:0;
}
a{color:inherit;text-decoration:none;}
p{margin:0 0 1.4em 0;}
img{max-width:100%;display:block;}
button{font-family:inherit;background:none;border:none;cursor:pointer;color:inherit;}
.label{
  font-family:var(--label);
  font-weight:600;
  font-size:0.72rem;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--sub);
}
.accent{color:var(--accent);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ===== Header ===== */
.site-header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,0.88);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);
}
.header-inner{
  max-width:72rem;
  margin:0 auto;
  padding:0 1.5rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:64px;
}
.brand{
  font-family:var(--sans);
  font-weight:700;
  font-size:0.85rem;
  letter-spacing:0.01em;
  line-height:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:60vw;
  display:inline-flex;
  align-items:center;
}
@media (min-width:600px){ .brand{font-size:0.97rem;} }
.header-nav{
  display:flex;
  align-items:center;
  gap:2rem;
}
.header-nav button, .header-nav a.nav-link{
  font-family:var(--label);
  font-weight:600;
  font-size:0.78rem;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--fg);
  padding:0.3rem 0;
  line-height:1;
  display:inline-flex;
  align-items:center;
  border-bottom:1px solid transparent;
  transition:border-color .2s, color .2s;
}
.header-nav button:hover, .header-nav a.nav-link:hover{
  border-bottom-color:var(--accent);
  color:var(--accent);
}
.nav-desktop{display:flex;align-items:center;gap:2rem;}
.hamburger{display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;}
.hamburger span{width:20px;height:1px;background:var(--fg);display:block;}
@media (max-width:760px){
  .header-nav .nav-desktop{display:none;}
  .hamburger{display:flex;}
}
.progress-bar{
  position:fixed;top:65px;left:0;height:2px;background:var(--accent);
  width:0%;z-index:101;transition:width .15s ease-out;
}

/* ===== ToC Overlay ===== */
.overlay{
  position:fixed;inset:0;background:var(--bg);z-index:200;
  overflow-y:auto;
  opacity:0;visibility:hidden;
  transition:opacity .25s ease;
}
.overlay.open{opacity:1;visibility:visible;}
.overlay-inner{max-width:56rem;margin:0 auto;padding:6rem 1.5rem 5rem;}
.overlay-close{
  position:fixed;top:1.6rem;right:1.8rem;font-family:var(--label);
  font-size:0.85rem;letter-spacing:0.1em;color:var(--sub);z-index:201;
  display:flex;align-items:center;gap:0.5rem;
}
.overlay-close:hover{color:var(--accent);}
.overlay-section{margin-bottom:3rem;}
.overlay-section h3{font-family:var(--label);font-size:0.75rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--sub);margin-bottom:1.2rem;font-weight:600;}
.toc-list{list-style:none;margin:0;padding:0;}
.toc-item{
  border-top:1px solid var(--rule);
}
.toc-item:last-child{border-bottom:1px solid var(--rule);}
.toc-item a{
  display:flex;align-items:baseline;gap:1.2rem;padding:1.1rem 0.2rem;
}
.toc-item a:hover .toc-title{color:var(--accent);}
.toc-num{font-family:var(--label);font-size:0.85rem;color:var(--sub);width:2.4rem;flex-shrink:0;}
.toc-title{font-family:var(--sans);font-size:1.1rem;font-weight:700;letter-spacing:0.01em;flex-shrink:0;transition:color .2s;}
.toc-q{font-size:0.85rem;color:var(--sub);font-family:var(--sans);line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
@media (max-width:640px){
  .toc-q{display:none;}
}
.overlay-menu-list{list-style:none;margin:0;padding:0;}
.overlay-menu-list li{border-top:1px solid var(--rule);}
.overlay-menu-list li:last-child{border-bottom:1px solid var(--rule);}
.overlay-menu-list a,.overlay-menu-list button{
  display:block;width:100%;text-align:left;padding:1rem 0.2rem;font-family:var(--sans);font-weight:500;font-size:0.97rem;
}
.overlay-menu-list a:hover,.overlay-menu-list button:hover{color:var(--accent);}

/* ===== Layout helpers ===== */
.container{max-width:var(--maxw);margin:0 auto;padding:0 1.5rem;}
.container-wide{max-width:60rem;margin:0 auto;padding:0 1.5rem;}
main{min-height:70vh;}

/* ===== Home ===== */
.hero{
  max-width:64rem;
  margin:0 auto;
  padding:7rem 1.5rem 5rem;
  text-align:left;
}
.hero-label{margin-bottom:1.6rem;}
.hero-pretitle{
  font-family:var(--sans);
  font-size:clamp(0.85rem, 1.6vw, 1.0rem);
  font-weight:500;
  color:var(--sub);
  letter-spacing:0.02em;
  margin-bottom:0.6rem;
}
.hero-title{
  font-size:clamp(2.1rem, 5.3vw, 3.5rem);
  letter-spacing:0.02em;
  margin-bottom:1.8rem;
}
.hero-authors{
  font-family:var(--label);
  font-weight:600;
  font-size:0.85rem;
  letter-spacing:0.06em;
  color:var(--sub);
  margin-bottom:2.8rem;
}
.hero-lower{
  display:flex;
  flex-direction:column;
  gap:2.4rem;
}
.hero-cover{
  width:200px;
  max-width:60%;
  flex-shrink:0;
}
.hero-cover img{
  width:100%;
  display:block;
  border:1px solid var(--rule);
  box-shadow:0 16px 32px -12px rgba(20,99,144,0.35);
}
.hero-intro{
  max-width:38rem;margin:0;color:var(--fg);font-size:1rem;line-height:2.0;text-align:left;
}
@media (min-width:800px){
  .hero-lower{
    flex-direction:row-reverse;
    align-items:flex-start;
    gap:3.5rem;
  }
  .hero-cover{width:260px;}
  .hero-intro{flex:1;}
}
.section-divider{border:none;border-top:1px solid var(--rule);max-width:var(--maxw);margin:0 auto;}
.section{padding:4.5rem 1.5rem;}
.section-head{max-width:var(--maxw);margin:0 auto 2.6rem;}
.section-head .label{margin-bottom:0.8rem;display:block;}
.section-head h2{font-size:clamp(1.3rem,2.6vw,1.65rem);}
.section-head .lede{color:var(--sub);margin-top:0.8rem;font-size:0.98rem;}

.chapter-list{max-width:var(--maxw);margin:0 auto;}
.chapter-row{
  display:flex;align-items:baseline;gap:1.2rem;
  padding:1rem 0;border-top:1px solid var(--rule);
}
.chapter-row:last-child{border-bottom:1px solid var(--rule);}
.chapter-row:hover .cr-title{color:var(--accent);}
.cr-num{font-family:var(--label);font-weight:600;font-size:0.8rem;color:var(--sub);width:2.2rem;flex-shrink:0;}
.cr-title{font-family:var(--sans);font-weight:500;font-size:0.95rem;flex-shrink:0;transition:color .2s;}
.cr-q{font-size:0.82rem;color:var(--sub);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
@media (max-width:600px){.cr-q{display:none;}}

.home-fig{max-width:44rem;margin:1rem auto 0;text-align:center;}
.home-fig img{margin:0 auto;border:1px solid var(--rule);}
figcaption{
  font-family:var(--label);font-size:0.75rem;letter-spacing:0.04em;color:var(--sub);
  margin-top:0.9rem;line-height:1.6;
}

.book-cta{max-width:var(--maxw);margin:0 auto;text-align:center;}
.book-cta p{color:var(--sub);margin-bottom:1.2rem;}
.btn-row{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
.btn{
  font-family:var(--label);font-size:0.78rem;letter-spacing:0.08em;text-transform:uppercase;
  padding:0.8rem 1.6rem;border:1px solid var(--fg);transition:all .2s;
}
.btn:hover{background:var(--fg);color:var(--bg);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{opacity:0.85;background:var(--accent);color:#fff;}

/* ===== Chapter View ===== */
.chapter-header{padding:5rem 1.5rem 3rem;text-align:center;border-bottom:1px solid var(--rule);}
.chapter-part{margin-bottom:1rem;}
.chapter-part.pt-tech{color:var(--part-tech);}
.chapter-part.pt-phil{color:var(--part-phil);}
.chapter-part.pt-society{color:var(--part-society);}
.chapter-part.pt-overview{color:var(--part-overview);}
.chapter-part.pt-tech-phil{color:var(--part-tech-phil);}
.chapter-part.pt-society-phil{color:var(--part-society-phil);}
.chapter-title{font-size:clamp(1.65rem,4vw,2.45rem);letter-spacing:0.02em;margin-bottom:1.2rem;}
.chapter-lede{
  max-width:38rem;margin:1.6rem auto 0;font-family:var(--sans);font-weight:500;
  font-size:1.1rem;line-height:1.9;color:#333;
}
.chapter-body{padding:3.5rem 1.5rem;}
.chapter-body .container p{margin-bottom:1.6em;}
figure.book-figure{margin:3rem auto;max-width:40rem;text-align:center;}
figure.book-figure img{border:1px solid var(--rule);padding:1.2rem;background:#FDFDFD;}
.pull-quote{
  max-width:var(--maxw);margin:3.5rem auto;padding-left:1.8rem;
  border-left:1px solid var(--accent-light);
}
.pull-quote p{
  font-family:var(--sans);font-size:1.35rem;line-height:1.9;font-weight:300;color:var(--fg);margin-bottom:0.8rem;
}
.pull-quote cite{font-family:var(--label);font-weight:600;font-size:0.75rem;letter-spacing:0.06em;color:var(--sub);font-style:normal;}

.chapter-sections{max-width:var(--maxw);margin:3rem auto;}
.chapter-sections h3{font-family:var(--label);font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--sub);margin-bottom:1.1rem;font-weight:600;}
.sec-list{list-style:none;margin:0;padding:0;}
.sec-list li{padding:0.55rem 0;border-top:1px solid var(--rule);font-size:0.95rem;color:#333;}
.sec-list li:last-child{border-bottom:1px solid var(--rule);}

.reading-guide{max-width:var(--maxw);margin:3rem auto;}
.reading-guide h3{font-family:var(--label);font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--sub);margin-bottom:1.3rem;font-weight:600;}
.rg-item{padding:1rem 0;border-top:1px solid var(--rule);}
.rg-item:last-child{border-bottom:1px solid var(--rule);}
.rg-title{font-family:var(--sans);font-weight:700;font-size:0.98rem;margin-bottom:0.3rem;}
.rg-author{font-size:0.85rem;color:var(--sub);margin-bottom:0.4rem;}
.rg-note{font-size:0.85rem;color:#444;line-height:1.7;}

.chapter-footnav{
  border-top:1px solid var(--rule);padding:2.5rem 1.5rem 4rem;
}
.footnav-inner{max-width:var(--maxw);margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;}
.footnav-link{font-family:var(--label);font-size:0.78rem;letter-spacing:0.05em;color:var(--sub);max-width:40%;}
.footnav-link:hover{color:var(--accent);}
.footnav-link .dir{display:block;font-size:0.68rem;letter-spacing:0.1em;margin-bottom:0.4rem;color:var(--sub);text-transform:uppercase;}
.footnav-link .ttl{font-family:var(--sans);font-weight:500;font-size:0.9rem;color:var(--fg);}
.footnav-link:hover .ttl{color:var(--accent);}
.footnav-center{text-align:center;}
.book-link-small{font-family:var(--label);font-size:0.72rem;letter-spacing:0.08em;color:var(--sub);border:1px solid var(--rule);padding:0.6rem 1.1rem;display:inline-block;}
.book-link-small:hover{border-color:var(--accent);color:var(--accent);}

/* ===== Lexicon View ===== */
.lexicon-head{max-width:60rem;margin:0 auto;padding:5rem 1.5rem 2rem;text-align:center;}
.lexicon-head h1{font-size:clamp(1.65rem,3.5vw,2.25rem);margin-bottom:1rem;}
.lexicon-head p{color:var(--sub);}
.lexicon-controls{
  max-width:60rem;margin:0 auto;padding:0 1.5rem 2.5rem;
  display:flex;gap:1rem;flex-wrap:wrap;align-items:center;
  position:sticky;top:65px;background:rgba(255,255,255,0.94);backdrop-filter:blur(6px);z-index:10;
  padding-top:1rem;border-bottom:1px solid var(--rule);
}
.search-input{
  flex:1;min-width:200px;border:none;border-bottom:1px solid var(--fg);padding:0.6rem 0.2rem;
  font-family:var(--sans);font-size:0.95rem;background:transparent;
}
.search-input:focus{outline:none;border-bottom-color:var(--accent);}
.chapter-filter{
  border:none;border-bottom:1px solid var(--rule);background:transparent;padding:0.6rem 0.2rem;
  font-family:var(--label);font-size:0.8rem;color:var(--sub);
}
.lexicon-count{font-family:var(--label);font-size:0.72rem;color:var(--sub);letter-spacing:0.05em;}
.lexicon-grid{
  max-width:60rem;margin:0 auto;padding:1rem 1.5rem 5rem;
}
.lex-index-group{margin-bottom:0.5rem;}
.lex-index-head{
  font-family:var(--sans);font-weight:700;font-size:1.3rem;letter-spacing:0.01em;color:var(--accent);
  padding:1.6rem 0 0.6rem;border-bottom:2px solid var(--accent-light);margin-bottom:0.2rem;
}
.lex-index-head:first-child{padding-top:0;}
.lex-item-grid{column-count:2;column-gap:3rem;}
@media (max-width:760px){.lex-item-grid{column-count:1;}}
.lex-item{break-inside:avoid;padding:1.3rem 0;border-top:1px solid var(--rule);}
.lex-term{font-family:var(--sans);font-weight:700;font-size:0.98rem;letter-spacing:0.01em;}
.lex-yomi{font-family:var(--sans);font-size:0.72rem;color:var(--sub);margin-left:0.5rem;}
.lex-en{font-family:var(--label);font-style:italic;font-size:0.78rem;color:var(--sub);margin-left:0.6rem;}
.lex-gloss{font-size:0.9rem;color:#333;margin:0.5rem 0 0.6rem;line-height:1.8;}
.lex-chapter-link{font-family:var(--label);font-size:0.7rem;letter-spacing:0.06em;color:var(--accent);}
.lex-empty{max-width:var(--maxw);margin:3rem auto;text-align:center;color:var(--sub);}

/* ===== Book View ===== */
.book-view{max-width:var(--maxw);margin:0 auto;padding:5rem 1.5rem 5rem;}
.book-view h1{font-size:clamp(1.65rem,3.5vw,2.25rem);margin-bottom:2.5rem;text-align:center;}
.book-cover-figure{max-width:320px;margin:0 auto 3rem;}
.book-cover-figure img{width:100%;display:block;border:1px solid var(--rule);box-shadow:0 20px 40px -14px rgba(20,99,144,0.35);}
.biblio{border-top:1px solid var(--rule);}
.biblio-row{display:flex;padding:0.9rem 0;border-bottom:1px solid var(--rule);font-size:0.92rem;}
.biblio-key{font-family:var(--label);font-size:0.72rem;letter-spacing:0.06em;color:var(--sub);width:8rem;flex-shrink:0;text-transform:uppercase;padding-top:0.15rem;}
.biblio-val{flex:1;}
.recommend-block{margin:3rem 0;padding:2rem 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);}
.recommend-block h3{font-family:var(--label);font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--sub);margin-bottom:1.2rem;font-weight:600;}
.recommend-quote{font-family:var(--sans);font-weight:300;font-size:1.05rem;line-height:1.95;margin-bottom:0.6rem;}
.recommend-name{font-family:var(--label);font-weight:600;font-size:0.8rem;color:var(--sub);margin-bottom:1.4rem;}
.book-links{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin:2.5rem 0;}
.notice{margin-top:3rem;padding:1.6rem 1.8rem;border:1px solid var(--rule);font-size:0.88rem;color:var(--sub);line-height:1.9;}

/* ===== Recommendations (multi) ===== */
.recommend-list{max-width:var(--maxw);margin:0 auto;}
.recommend-item{padding:2rem 0;border-top:1px solid var(--rule);}
.recommend-item:last-child{border-bottom:1px solid var(--rule);}
.recommend-item .recommend-title{font-family:var(--sans);font-weight:700;font-size:1.0rem;letter-spacing:0.01em;margin-bottom:0.9rem;color:var(--fg);}
.recommend-item .recommend-quote{font-family:var(--sans);font-weight:300;font-size:1.02rem;line-height:2.0;margin-bottom:0.9rem;color:#333;}
.recommend-item .recommend-name{font-family:var(--label);font-weight:600;font-size:0.8rem;color:var(--sub);text-align:right;}

/* ===== Authors ===== */
.authors-list{max-width:60rem;margin:0 auto;}
.author-item{
  display:flex;gap:2rem;padding:2.6rem 0;border-top:1px solid var(--rule);
  align-items:flex-start;
}
.author-item:last-child{border-bottom:1px solid var(--rule);}
.author-item.no-photo{gap:0;}
@media (max-width:640px){.author-item{flex-direction:column;gap:1.2rem;}}
.author-photo{
  width:96px;height:96px;border-radius:50%;flex-shrink:0;
  border:1px solid var(--rule);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:#FAFAFA;
}
.author-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.author-monogram{
  font-family:var(--sans);font-size:1.6rem;font-weight:700;color:var(--sub);
}
.author-body{flex:1;}
.author-name{font-family:var(--sans);font-size:1.15rem;font-weight:700;letter-spacing:0.01em;margin-bottom:0.2rem;}
.author-name .yomi{font-family:var(--label);font-size:0.7rem;color:var(--sub);font-weight:400;margin-left:0.6rem;letter-spacing:0.02em;}
.author-role{font-family:var(--label);font-weight:600;font-size:0.78rem;color:var(--sub);letter-spacing:0.03em;margin-bottom:0.9rem;}
.author-bio{font-size:0.92rem;line-height:1.9;color:#333;}
.author-bio a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;}

<script>
const DATA = {"chapters":[{"number":0,"title":"はじめに","part":"総論","sections":["0.1 AIと暮らす時代","0.2 AIの社会的影響","0.3 未来の技術としてのAI","0.4 AIが問う人間観","0.5 AIに対する3つの態度","0.6 本書の構成"],"digest":["2022年末のChatGPT公開を境に、AIは専門家のための難解な技術から、誰もが日常的に対話する存在へと姿を変えた。本章はこの変化を出発点に、生成AIがもたらす利便性と、フェイク画像や著作権問題に象徴される社会的な軋轢を対比的に描き出し、AIの理解がもはや専門家任せにできない「現代の教養」であることを示す。","興味深いのは、AIの得意・不得意がこれまでの常識を裏切る形で現れている点である。かつて人間の聖域とされた創造的な文章や絵画をAIがこなす一方、子どもでもできる部屋の片づけのような身体的作業は依然として難しい。この逆転現象は、「知能とは何か」という問いを新たな角度から私たちに突きつける。","著者らはAIへの向き合い方を「技術としてのAI」「心の哲学としてのAI」「社会の中のAI」という3つの観点に整理し、これらが互いに独立ではなく、技術の進歩が哲学的問いを生み、その問いが社会に影響し、社会の要請がまた技術を方向づけるという循環関係にあることを本書全体の設計図として提示する。"],"highlight":"AIの得意・不得意の逆転現象が、知能とは何かという問いを技術論から哲学的な人間観の問題へと押し広げている。","quote":{"text":"その複雑で本質的な問いを、読者1人1人が自分自身の言葉で考えていくための羅針盤となることを願っている。","note":"本書の狙いを述べた「はじめに」の結びの一文。"},"reading_guide":[],"question":"AI という複雑な技術と社会現象に対して、私たちはどのような視点から学び、向き合うべきか？","theme":"生成 AI が社会に急速に普及する中で、AI 技術・哲学・社会課題の複合的な理解が必要な時代背景を示す。","fulltext":[{"heading":"0.1 AIと暮らす時代","blocks":[{"type":"p","text":"AIと暮らす時代がやってきた。2020年代前半から普及し始めた生成AI（generative AI）は、自然言語を介して手軽に扱える技術として、またたく間に社会に広がっていった。AIの研究開発は半世紀以上の歴史を持つが、2020年代の生成AIブームに至って初めて、AIは一般の人々にまで普及したといえる。いまやAIは、手放せない道具として、もしくはパートナーとして、私たちの生活の一部となっている。"},{"type":"p","text":"2022年11月末にOpenAIによって発表されたChatGPTはやがて世界中に広がり、ITやAIの専門家のみならず、一般の人々が気軽に利用する存在となった。ChatGPTは人間の言語データをモデル化する大規模言語モデル（large language model, LLM）（第6章参照）に基づいている。大規模なモデルに基づくAIはその後どんどん進化を遂げ、2025年現在ではGoogleのGeminiや、xAIのGrokなどさまざまなAIが普及している。"},{"type":"p","text":"ChatGPTとの対話はとても自然である。質問に対する回答が的確なだけではなく、文脈を考慮に入れた会話が可能なため、まるで知的な対話相手のように感じられる。そのため、アイデアを出し合うブレインストーミングのパートナーとして、問題解決の相談相手として、老若男女を問わずに活用する人が増加している。教育現場での学習支援や、ビジネスシーンでの文書作成補助、プログラミング支援、さらには創作活動のインスピレーション源としても広く活用されるようになってきた。"},{"type":"p","text":"また、大規模言語モデルの普及と同時に、画像や動画を生成するAIも広まった。急速に発展した拡散モデル（diffusion model）やフローマッチング（flow matching）に基づく画像生成技術や動画生成技術は、本物と見まごう画像や動画を生成できるようになった。こうしたAIによる生成技術は、私たちの創作活動のあり方を大きく変えている。"}]},{"heading":"0.2 AIの社会的影響","blocks":[{"type":"p","text":"その一方で、いまや生成AIは政治を含む社会を揺るがす存在としても、無視できなくなってきている。"},{"type":"p","text":"その一例として、簡単にフェイクニュース画像や動画が作れるようになったことが挙げられる。2024年のドナルド・トランプとカマラ・ハリスが戦った米国の大統領選では、候補者のパロディ動画がSNSやYouTubeにとどまらず地上波でも公然と流れ、政治的な印象操作に用いられた。また画像生成モデルは、これまで世界中のアーティストたちが描いてきたイラストなどの作品を学習に（しばしば無断）使用している。長い時間をかけて技術を習得しイラストを描く絵師たちと、ただプロンプトを打ち込み、絵師たちの努力や投資にただ乗りしてそれっぽい画像や動画を出力する人々、そしてそれを可能にするAI開発者たちとの軋轢は深刻なものになっている。そのほか、生成AIの出力の正確性や信頼性の問題、個人情報やプライバシーの保護、AIによる差別や偏見の助長、雇用への影響など、生成AIに関する多岐にわたる課題が指摘されている。"},{"type":"p","text":"こうしたAI倫理やAIの社会的影響についての議論は、2010年代半ばまでは主に研究者や専門家による仮説的な議論にとどまりがちであった。しかし、このような生成AIの急速な普及と社会的な情勢の変化によって、AIの社会的影響は、法制度の整備を含め、具体的な対応が必要な喫緊の課題へと変化している。特に、生成AIの発展は従来の技術的・倫理的な議論の枠組みを大きく超えている。かつては「難解な技術」「専門家のためのツール」というイメージが強かったAIが、いまや日常生活に寄り添うパートナーとして認識されるようになり、その影響力は社会の隅々にまで及びつつある。この変化は、AIの利活用に関する新たな倫理的・法的・社会的課題（ethical, legal and social issues, ELSI）を浮き彫りにしている。"},{"type":"p","text":"AIの進歩が非常に速い一方で、法律や制度の整備がそのスピードに追いついておらず、この「時間のずれ」が大きな課題となっている。例えば、現在、画像・動画生成において生み出されたコンテンツから利益を得るのが、学習元となったイラストを描いてきた創作者たちではなく、そのAIサービスを運用するプラットフォーマーであったり、それに投資する資本家であるというのもまた、技術の進化に「あるべき社会」とそれを支える制度設計の議論が追いついていないことを示す一例だろう。"},{"type":"p","text":"こうした中で、AIの未来を専門家任せにせず、社会の一員である私たち1人1人がその担い手となるという視点が重要だ。開発者や利用者に限らず、政策立案者や市民全体がAIを理解し、社会の中でAI利用に関する対話を重ねていくことが求められている。1人1人の市民がAIの基礎知識を身につけることは、個人にとってはもちろん、社会にとっても大きな意味を持つ。AIの光と影を理解する人が増えることで、企業や政府への健全なチェック機能が働き、より公平で透明なルール作りが促されるからだ。"},{"type":"p","text":"いまやAIは一部の専門家のものではなく、経営や行政、農業、介護、教育など、あらゆる分野の人々にかかわる技術となった。本書は、そうした時代に向けた最初の一歩として、文理の枠を超え、AI技術とその哲学、社会課題を複合的に学ぶための「現代の教養」への入り口となることを目指している。"}]},{"heading":"0.3 未来の技術としてのAI","blocks":[{"type":"p","text":"生成AIが実現している現状の技術群は、やはりどこかで「ワクワクする存在」でもある。今日の状況は、2010年代まで夢物語のように語られてきたSFが、突如として現実のものとなったような状況であり、かつてSF作品で描かれた未来の技術が実際に目の前に存在していることは、確かにエキサイティングな事実といえるだろう。振り返れば、新幹線や携帯電話、SNS、動画配信サービスも、かつては「想像もできない」非現実的な存在だった。私たちの頭の中を百年から数百年前にタイムスリップさせ、その時代の人々の視点で現代を見てみれば、今日の技術がいかに圧倒的で特別なものであるかが理解できる。AI技術はSF作品における典型的なモチーフであり、その一部が現実のものとなったいま、私たち人類は未踏の地へと歩みを進めているということを実感させる。SFアニメで夢見ていた時代が近づいている現在、私たちは一体次に何を夢見るのだろうか。そしてどんな未来を創っていくのだろうか。"}]},{"heading":"0.4 AIが問う人間観","blocks":[{"type":"p","text":"現在のAIの進歩、そしてSFに描かれるような未来のAIは、私たちのアイデンティティや「人間らしさ」の根幹を問い直し始めている。"},{"type":"p","text":"AIにできることが急速に増え、これまで「人間にしかできない」と考えられてきた領域が揺らぎ始めている。例えば、文章を書いたり、美しい絵画を描いたり、心沸き立つ音楽を作曲したりといった創造的な活動もできるようになり、それらはもはや人間の聖域ではなくなった。第13章で触れるように、2010年代前半の第3次AIブームの時期には、AIは結局のところ定型化された仕事しかできず、創造的な仕事や人と向き合う仕事は人間に残されるという見方が広く流布していた。しかし、2020年代の生成AI時代に入ると、むしろそうした仕事こそがAIの得意分野であるという見方が広がりつつある。"},{"type":"p","text":"こうした、AIの得意・不得意のアンバランスさは興味深い。これまで、知的であったり、創造的であったりするものは人間ならではの知能の表れとして捉えられてきた一方、身体的な動作や作業はそうとはみなされてこなかった。しかし、チェスの世界チャンピオンに勝つような高度な知能は再現できるのに、子どもでもできる部屋の片づけといった身体的な作業は、現代のAIがロボットの身体をもってもなかなか難しい。"},{"type":"p","text":"この知能の逆転現象は、私たちが日常的に使う「機械的」「AI的」という言葉の意味すら変えつつある。かつて「機械的」とは、思考を伴わない定型作業を表し、「AI的」は創造性のない応答を指す言葉だった。しかし、かつて人間ならではの聖域とされた創造的な対話や文章作成もいまやAIが得意なタスクとなっている。無感情で定型的な振る舞いをするのが「AIのようだ」と表現されることも、もはや時代遅れのイメージとなりつつあるのかもしれない。一方で、柔軟な身体作業はまだ比較的苦手である。このことは、私たち人間にとって本質的な知能とは何なのか、という根源的な問いを投げかけている。"},{"type":"p","text":"AIという技術は、単なる道具としての側面だけでなく、私たちの人間観そのものを変革する力を持っている。技術をどう使うかという議論だけでなく、AIと共存する社会で、私たちはどのような人間でありたいのか、どのような社会を築きたいのか。1人1人がこの問いに向き合うことが、いままさに求められている。"}]},{"heading":"0.5 AIに対する3つの態度","blocks":[{"type":"p","text":"AIはこれまでにない強力なツールでもあり、新たな社会問題を生み出す存在でもあり、ワクワクする未来の技術でもあり、人間観に変更を迫る存在でもある。このように視点によってさまざまな顔を持つAIだが、本書ではAIへの態度・問題関心を以下の3つに分けて考えてみたい。"},{"type":"h4","text":"❶技術としてのAI"},{"type":"p","text":"機械学習や深層学習をはじめとする技術的な側面への興味関心である。数理的な理論や実装方法、アルゴリズムの改良、応用可能性の探求など、工学的・技術的な観点からAIにアプローチする。より高性能で信頼性の高いAIシステムをどう実現し、社会に役立てていくかが主な関心事となる。"},{"type":"h4","text":"❷心の哲学としてのAI"},{"type":"p","text":"人工知能という存在を通して、人間の知性や意識、心の本質を問い直す哲学的および認知科学的な興味関心である。AI研究は、単なる思索にとどまらず、知能や心を「作ってみることによって理解する」という構成論的アプローチとしての側面を持つ。AI研究は創設以来、哲学者との対話を重視してきており、単なる技術開発を超えて人間存在の本質に迫る試みでもある。"},{"type":"h4","text":"❸社会の中のAI"},{"type":"p","text":"AIの普及が社会にもたらす変化や影響への興味関心である。雇用の変化、教育のあり方、倫理的な課題、法制度の整備など、社会システムのさまざまな側面でAIがもたらす変革を考察する。ここでは、AIと人間が共生する社会をいかに構築していくかが中心的な課題となる。"},{"type":"p","text":"これら3つの視点は相互に関連し合いながら、私たちのAIに対する理解と向き合い方を形づくっている。技術的な進歩は哲学的な問いを生み、それらは社会に広く影響する。哲学的な問いや概念、あるいは社会からの期待や懸念が、次の技術を方向づけもする。このAIの技術、哲学、社会的観点の不可分な関係について複合的な視点を持つことで、AIという現象をより立体的に捉えることが可能となるだろう。"}]},{"heading":"0.6 本書の構成","blocks":[{"type":"p","text":"本書では、「技術としてのAI」「心の哲学としてのAI」「社会の中のAI」という3つの観点から、AI時代を生きるためのリテラシーにふさわしいと筆者らが考える内容を選び、以下の14章構成とした（図0.1）。"},{"type":"p","text":"●第1章では、生成AIがもたらしている社会的な影響について触れる。"},{"type":"p","text":"●第2章ではAIという概念のさまざまな定義や、その発展の歴史的経緯を振り返る。"},{"type":"p","text":"●続く第3章～第7章では、AIとよりよくつきあうために必要となる、AI技術についての基礎的な知識を扱う。第3章ではかつてAI研究の主流であった記号的AIの考え方とその限界について解説し、第4章ではデータから知識を獲得する機械学習の考え方と主要な学習の枠組みを整理する。続いて第5章では、深層学習や基盤モデルによって生成AIが成立した技術的背景をたどり、第6章にて自然言語処理の発展を通して大規模言語モデルの仕組みと特徴について解説する。第7章ではロボティクスを題材として、AIが身体を持ち実世界で知能を発揮する可能性と課題を展望する。"},{"type":"p","text":"●第8章で、AIの進展とともに心の科学が発展してきた過程に橋渡しを行ったうえで、第9章ではAIは意識を持てるか、第10章では感情を持てるか、第11章では人間になれるかという根本的な問いを哲学（およびAI研究）がどのように扱ってきたかを見ていく。"},{"type":"p","text":"●第12章では、本章で触れたAIのリスクに社会として対処する「AIガバナンス」の考え方を概観する。"},{"type":"p","text":"●さらに今後は、AIは単なる入出力システムを超えて、「自律性」や「主体性」を備えたエージェント技術となり、それに伴って、多くの新しい哲学的・倫理的問題が出てくるだろう。未来のAIと人間社会のかかわり方について第13章で扱う。"},{"type":"p","text":"●最後の第14章にて、本書の全体を振り返りつつ、AI社会の作り方、AI社会の中での生き方について考える。"},{"type":"figure","ref":"図0.1","caption":"各章の位置づけ"},{"type":"p","text":"どの章も独立したものとして読むことができる。大学の講義などで一通りの内容を扱う場合第1章から順番に学んでいただくことを想定しているが、すでにどれかの専門知識がある方には、自身が詳しくない部分を中心に読んでいただくとよいだろう。本書で扱いきれていない話題については、各章末の参考文献にぜひ当たっていただきたい。"},{"type":"p","text":"「AIと暮らす時代」は私たちにポジティブにもネガティブにも課題を突きつけている。それは機会であり、脅威でもある。それは私たちが思い描く夢でもあり、すでにここにある現実でもある。そんな、視点によってさまざまな顔を持つAIという存在と、私たちはどう向き合っていくべきか。本書が、その複雑で本質的な問いを、読者1人1人が自分自身の言葉で考えていくための羅針盤となることを願っている。"}]}],"full_public":true},{"number":1,"title":"社会の中の AI","part":"社会","sections":["1.1 生成AIの時代","1.2 生成AIで何が変わったのか","1.3 現代におけるAIのリスク","1.4 利用者自身にとってのリスク","1.5 他者や社会が被るリスク：AIのELSI","1.6 人間に近づくAI"],"digest":["本章はまず、生成AIが自然言語によるプロンプトを通じて何を可能にしたのかを整理し、能力の凹凸を「ギザギザのフロンティア」という言葉で捉える。そのうえで、AIには従来の製品と違って取扱説明書や明確な責任の所在がないという特殊性を指摘し、リスクへの向き合い方の難しさを浮き彫りにする。","リスクは「利用者自身」「他者や社会全体」「他者としてのAI」という3層に整理される。ハルシネーションや誤った予測から、バイアスによる格差の助長、著作権・環境負荷まで、個々の事例が丁寧に紹介されるが、単なる列挙にとどまらず、AIと人間社会が出力とデータを介してバイアスを強化し合う悪循環という構造的な視点が導入される。","終盤では、対話型AIが記憶機能を持つことで「道具」から「相手」へと体験が変質しつつある現状に焦点が当てられる。AIを擬人化することで生じるプライバシーや心理的依存のリスクを紹介しつつ、その是非の判定には意識や感情をめぐる哲学的な考察が不可欠であるとして、後続の章への橋渡しとする。"],"highlight":"AIには取扱説明書も明確な責任の所在もないため、リスクへの対処を専門家や規制だけに委ねられず、利用者自身が担う部分が大きくなっている。","quote":{"text":"AIの能力のフロンティア（最前線）は、開発者にも予想できない凹凸がある。","note":"生成AIの性能が課題ごとに大きくばらつく特性を評した一節。"},"reading_guide":[{"title":"あなたを支配し、社会を破壊する、AI・ビッグデータの罠","author":"キャシー・オニール","note":"2010年代のAI倫理論を代表する一冊として紹介されている。"},{"title":"AI Snake Oil: What Artificial Intelligence Can Do, What It Can't, and How to Tell the Difference","author":"Arvind Narayanan, Sayash Kapoor","note":"AIの過剰宣伝を見抜く視点を提供する書として挙げられている。"},{"title":"AI・ロボットからの倫理学入門","author":"久木田水生、神崎宣次、佐々木拓、本田康二郎","note":"応用倫理学の観点からAI・ロボットの倫理問題を扱う入門書として紹介されている。"}],"question":"生成 AI のもたらす可能性と課題のバランスを取りながら、個人と社会はいかに対応すべきか？","theme":"生成 AI の登場による社会への具体的な影響と、利用者個人および社会全体が直面するリスクの多層性を検討する。"},{"number":2,"title":"AI とは何か？","part":"技術と哲学","sections":["2.1 AIとは何か？","2.2 AIの歴史","2.3 計算パラダイムのシフトとAIのリスク"],"digest":["AIという言葉の定義がなぜ曖昧なのかを、SF的なイメージと学術的な機能主義的定義とのずれから説き起こす。ダートマス会議でのミンスキーの定義を紹介しつつ、「知能」という概念自体が固定的な科学用語ではなく、AI研究の進展とともに絶えず更新されてきたことを論じる。","1950年代のダートマス会議から2020年代の生成AIまでの歴史が、記号的AI・機械学習・生成AIという技術的ブレイクスルーの連鎖として通観される。ブームと「AIの冬」が繰り返される中で、「AI」という呼称そのものが普及すると使われなくなる「AI効果」のような興味深い現象にも触れられる。","章の後半では、この歴史が情報処理のあり方という観点から「固いトークン」（記号的AI）「柔らかい情報処理」（機械学習）「柔らかいトークン」（生成AI）という三段階のパラダイムシフトとして整理し直される。この枠組みは、各段階でリスクの性質もまた質的に変化してきたことを示す土台となっている。"],"highlight":"AIの定義の曖昧さは欠陥ではなく、技術の進歩とともに変化する私たちの知能観そのものを映す鏡である。","quote":{"text":"『人工知能』という語は、技術の進歩とともに変化する私たちの『知能』観を映し出す鏡もいえる。","note":"AIという言葉の意味の変遷を総括する一節（原文の趣旨を短縮して引用）。"},"reading_guide":[{"title":"Artificial Intelligence: A Modern Approach 4th Edition","author":"Stuart Russell, Peter Norvig","note":"AI分野を広くカバーする定番教科書として紹介されている。"},{"title":"コンピュータには何ができないか：哲学的人工知能批判","author":"ヒューバート・L・ドレイファス","note":"記号的AIに対する代表的な哲学的批判の書として挙げられている。"},{"title":"マインズ・アイ：コンピュータ時代の「心」と「私」 上・下","author":"D・R・ホフスタッター、D・C・デネット（編）","note":"コンピュータと心の関係を多角的に論じる論文集として紹介されている。"},{"title":"「人工知能」前夜：コンピュータと脳は似ているか","author":"杉本舞","note":"ダートマス会議以前の計算機科学史を掘り下げた一冊として紹介されている。"}],"question":"AI という言葉の意味はなぜ時代とともに変わり、それは何を意味しているのか？","theme":"AI という概念の多様な定義と、歴史的展開を通じた AI 観の変化を俯瞰し、現代 AI の位置づけを明確にする。"},{"number":3,"title":"記号的 AI と計算機","part":"技術","sections":["3.1 計算機と記号的AIの知識表現","3.2 記号的AIが抱えた問題","3.3 哲学からの記号的AI批判"],"digest":["記号的AIの根幹にある物理記号システム仮説を、実世界の符号化・記号操作・復号化というプロセスとして解説し、知能を「構文論的な記号操作」として捉える発想がいかに論理学・計算機科学と結びついていたかを示す。ここでは構文論と意味論の区別が、記号的AIの強みと限界を同時に説明する鍵として位置づけられる。","知識獲得のボトルネック、記号接地問題、フレーム問題という3つの根本的な壁が、それぞれ具体的な思考実験や事例とともに描かれる。特にデネットの「爆弾を積んだワゴン」の寓話は、状況に応じて重要な知識だけを瞬時に選び出す人間の能力がいかに謎めいているかを鮮やかに示している。","サールの中国語の部屋やドレイファスの現象学的批判が紹介された後、これらの20世紀の哲学的論争が現在の大規模言語モデルの前でどう姿を変えて再燃しているかが論じられる。過去の議論をなぞるのではなく、AIと日常的に接する私たちだからこそ問い直せる新しい哲学的な問いとして位置づけ直される点が本章の眼目である。"],"highlight":"記号接地問題やフレーム問題は消滅したのではなく、生成AIの時代においても文脈を変えて形を変え続けている。","quote":{"text":"知能は理解を要求し、理解はコンピュータに常識という背景を与えることを要求するが、その常識を成人した人間が持っているのは、彼が身体を持ち、技能を通じて物質世界と相互作用し、ある文化へと教育されるからだ","note":"ドレイファス『コンピュータには何ができないか』からの引用として本文中に紹介されている一節。"},"reading_guide":[{"title":"Artificial Intelligence: A Modern Approach 4th Edition","author":"Stuart Russell, Peter Norvig","note":"記号的AIの学問的基盤を含め、AI全般をカバーする教科書として紹介されている。"},{"title":"コンピュータには何ができないか：哲学的人工知能批判","author":"ヒューバート・L・ドレイファス","note":"記号的AI批判の代表書としてあらためて紹介されている。"},{"title":"マインズ・アイ：コンピュータ時代の「心」と「私」 上・下","author":"D・R・ホフスタッター、D・C・デネット（編）","note":"チューリングやサールの原論文を収めた論文集として紹介されている。"}],"question":"知識を形式的に表現し推論する方法では、なぜ現実の複雑な問題解決が難しいのか？","theme":"初期の AI 研究の中核をなした記号的 AI の理論的基礎と、その内在的な限界を明らかにする。"},{"number":4,"title":"パターン認識と機械学習","part":"技術","sections":["4.1 パターン認識の課題","4.2 教師あり学習","4.3 教師なし学習と強化学習","4.4 機械学習モデルの構築と評価"],"digest":["パターン認識を「入力xを出力yに変換する関数f」として捉える視点が導入され、人間があらかじめルールを書き込むルールベースの手法が、現実世界の多様性や不確実性の前でなぜ破綻するのかが具体例とともに説明される。ここから、ルールを人間が教える代わりにデータから学習させるという発想の転換が機械学習の出発点として位置づけられる。","教師あり学習・教師なし学習・強化学習という3つの学習の枠組みが、外部からのフィードバックの違いという観点から整理される。特に教師あり学習における勾配法の直感的な説明や、特徴量エンジニアリングという長年のボトルネックが次章の深層学習への伏線として周到に配置されている。","終盤では、訓練データ・検証データ・テストデータを厳密に分けて汎化性能を評価する作法が説かれる。過学習を「過去問の丸暗記」に例える比喩など、性能評価の落とし穴を平易に伝える工夫がなされており、機械学習を実際に使ううえでの基礎的な作法として位置づけられている。"],"highlight":"人間が識別ルールを言語化できなくても、事例と正解だけを示せば機械が規則性を学び取れるという発想の転換が、AI研究の大きな飛躍を開いた。","quote":{"text":"答えは、確実にできることから始めることである。","note":"識別ルールを言語化できなくても事例と正解は示せる、という教師あり学習の発想を導入する一節。"},"reading_guide":[{"title":"パターン認識と機械学習：ベイズ理論による統計的予測 上・下","author":"C・M・ビショップ","note":"通称「PRML」として知られる、機械学習を確率モデルとして統一的に扱う定番書として紹介されている。"},{"title":"Python ではじめる機械学習：scikit-learnで学ぶ特徴量エンジニアリングと機械学習の基礎","author":"Andreas C. Müller, Sarah Guido","note":"scikit-learnを使った実践的な入門書として紹介されている。"},{"title":"はじめてのパターン認識","author":"平井有三","note":"数理的基礎から丁寧に解説する定番の入門書として紹介されている。"}],"question":"人間が明示的に知識を与えなくても、機械はデータから何をいかに学ぶことができるのか？","theme":"データから規則性を学習する機械学習の考え方と、実践的な学習アルゴリズムの種類および特性を解説する。"},{"number":5,"title":"ニューラルネットワークと深層学習","part":"技術","sections":["5.1 ニューラルネットワークとは何か？","5.2 深層学習の登場とインパクト","5.3 代表的な深層学習アーキテクチャ","5.4 自己教師あり学習と基盤モデル"],"digest":["ニューラルネットワークが生物の神経系から着想を得ながらも、今日では脳を忠実に再現するというより工学的に洗練された関数近似の道具として発展してきた経緯が描かれる。誤差逆伝播法による学習の仕組みが、順伝播・損失関数・勾配法という要素に分解されて説明される。","深層学習の核心は特徴量エンジニアリングからの解放にあるとされ、それを阻んでいたアルゴリズム・データ・計算能力という3つの壁が、ReLU関数やGPU、ImageNetのような具体的な技術革新によって一つずつ克服されていく過程が語られる。CNN・RNN・Transformerという代表的なアーキテクチャの違いも、それぞれが得意とするデータの性質から明快に整理される。","終盤では、ラベルなしデータを自ら教師に変える自己教師あり学習が基盤モデルへと接続される流れが示される。基盤モデルが識別だけでなく生成の能力を獲得し、GANや拡散モデルと結びつくことで現在の生成AIブームが成立したという見立てが、次章の大規模言語モデルへの導入となっている。"],"highlight":"深層学習の最大の意義は性能向上そのものではなく、人間が特徴量を設計するという長年のボトルネックからAI自身を解放した点にある。","quote":{"text":"深層学習の最大の意義の1つは、特徴量エンジニアリングからの解放にある。","note":"深層学習がもたらした技術的転換の核心を要約した一節。"},"reading_guide":[{"title":"深層学習","author":"Ian Goodfellow, Yoshua Bengio, Aaron Courville","note":"深層学習の基礎から応用までを網羅する世界的定番書として紹介されている。"},{"title":"イラストで学ぶディープラーニング 改訂第2版","author":"山下隆義","note":"豊富なイラストで直感的に理解できる一冊として紹介されている。"},{"title":"ゼロから作る Deep Learning ⑤：生成モデル編","author":"斎藤康毅","note":"GANやVAEなど生成モデルを理論とコードの両面から学べる一冊として紹介されている。"}],"question":"単純な単位の多層組み合わせで、なぜ複雑な知的作業が実現されるようになったのか？","theme":"ニューラルネットワークという生物的着想を基とした学習モデルが深層化することで、生成 AI が可能になった技術的背景を示す。"},{"number":6,"title":"大規模言語モデルと生成AI","part":"技術","sections":["6.1 統計的機械学習と自然言語処理","6.2 深層学習による言語処理","6.3 大規模言語モデルと生成AIの時代"],"digest":["形態素解析・構文解析・意味解析・文脈解析という自然言語処理の基礎技術が具体例とともに解説されたのち、BoWやn-gramモデルといった統計的手法が、語順や文脈を扱いきれないという限界に直面していく様子が描かれる。ここでは「文が生成される確率」という捉え方への転換が、後の言語モデルの土台として強調される。","word2vecによる単語埋め込みが「パリ－フランス≒東京－日本」のようなベクトル演算を可能にした発見的な意義から説き起こし、RNN・系列変換モデルを経てTransformerの自己注意機構に至る技術系譜が丁寧にたどられる。この流れの中で、GPTが「1つのタスクに1つのモデル」という発想そのものを覆したことの意味が強調される。","終盤では、インストラクション・チューニングやRLHFによってモデルの振る舞いを人間の価値観に合わせるAIアライメントの重要性が論じられる。さらに、推論・ツール利用・複数エージェント協調といった技術によってAIが単なる応答生成器から自律的なエージェントへと変貌しつつある最新の潮流が示される。"],"highlight":"GPTの本質的な革新は性能の向上以上に、「1つのタスクに1つのモデル」という従来の発想を覆し、1つの巨大な言語モデルで多様な課題に対応できることを示した点にある。","quote":{"text":"十分に巨大な言語モデルによる次単語予測は、知識検索・質問応答・翻訳など多様な機能を担うシステムとしても働きうることを示した","note":"GPTがもたらした発想の転換を要約した一節。"},"reading_guide":[{"title":"大規模言語モデルは新たな知能か：ChatGPTが変えた世界","author":"岡野原大輔","note":"LLMのインパクトと仕組みを平易に解説する入門書として紹介されている。"},{"title":"大規模言語モデル入門","author":"山田育矢（監修/著）、鈴木正敏、山田康輔、李凌寒","note":"Transformerなどモデル構造の基本を技術的な視点で解説する一冊として紹介されている。"},{"title":"自然言語処理の教科書","author":"小町守","note":"ルールベースから深層学習まで自然言語処理の技術を体系的にまとめたテキストとして紹介されている。"},{"title":"ことばの意味を計算するしくみ：計算言語学と自然言語処理の基礎","author":"谷中瞳","note":"計算言語学と深層学習ベースの自然言語処理を橋渡しする一冊として紹介されている。"}],"question":"自然言語の確率的モデル化によって、なぜ人間らしい対話や文章生成が可能になったのか？","theme":"自然言語を統計的に処理する方法の進化が、大規模言語モデルという基盤技術へいかに至ったかを追跡する。"},{"number":7,"title":"ロボティクスと身体の知","part":"技術と哲学","sections":["7.1 身体と知能：実世界の困難さ","7.2 環境適応する知能：試行錯誤と学習","7.3 対象を操る知能：モデル化と予測","7.4 言語・基盤モデルとの融合"],"digest":["ブルックスの「象はチェスをしない」という問題提起とモラベックのパラドックスを軸に、抽象的な論理的推論よりも歩く・物を掴むといった身体的な知能の方がAIにとってはるかに難しいという逆説が描かれる。サブサンプションアーキテクチャや受動歩行ロボットの例は、詳細な世界モデルを持たずとも身体と環境の相互作用から知的な振る舞いが創発しうることを鮮やかに示す。","強化学習によるロボットの歩行制御の進展と、そこに立ちはだかるSim2Realギャップ、模倣学習によるマニピュレーション技術の発展が具体的な事例とともに紹介される。深層予測学習や自由エネルギー原理といった、知覚と行動を不可分なものとして捉える枠組みも導入され、次章の認知科学的な議論への接続点となっている。","終章では、大規模言語モデルが自然言語の指示をロボットの行動計画へと変換するCode as PoliciesやSayCanのような取り組みが紹介され、かつて分断されていた記号的・言語的知能と身体的な行動学習が統合されつつある「フィジカルAI」という新潮流が展望される。"],"highlight":"人間にとって高度な知的活動とされる論理的推論よりも、幼児でもできる歩行や片づけの方がAIにはるかに難しいという逆説こそが、身体を持つことの意味を問い直させる。","quote":{"text":"世界それ自体こそが最良のモデルである。","note":"ロドニー・ブルックスの言葉として本文中に引用されている一節。"},"reading_guide":[{"title":"イラストで学ぶ ロボット工学","author":"木野仁（著）、谷口忠大（監修）","note":"ロボット工学の基礎をストーリー仕立てで学べる入門書として紹介されている。"},{"title":"柔らかヒューマノイド：ロボットが知能の謎を解き明かす","author":"細田耕","note":"身体性が認知や運動学習に果たす役割を考察する一冊として紹介されている。"},{"title":"ROS2とPythonで作って学ぶ AIロボット入門 改訂第2版","author":"出村公成、萩原良信、升谷保博、タン ジェフリー トゥ チュアン","note":"ROS2とPythonでAIロボットを構築する実践的なテキストとして紹介されている。"},{"title":"基盤モデルとロボットの融合：マルチモーダルAIでロボットはどう変わるのか","author":"河原塚健人、松嶋達也","note":"基盤モデルによるロボット技術の変革を解説する一冊として紹介されている。"}],"question":"知識や言語だけでなく、身体と環境の相互作用は AI にとってなぜ本質的に重要なのか？","theme":"物理的な身体と環境を持つロボットが直面する知的課題と、それを解決するための認知および学習のあり方を検討する。"},{"number":8,"title":"AIから認知科学へ","digest":["AI研究と人間の心の研究は、車の両輪のように発展してきた。1960年代、記号的AI研究を背景に、認知とは記号操作にほかならないとする計算主義が認知科学の主流となる。だが脳の生理学的構造との対応関係や、思考の柔軟さの説明に困難を抱えることになった。","1980年代、これに対抗する形でコネクショニズムが台頭する。人工ニューラルネットワークの学習原理を認知のモデルとみなし、汎化能力や優雅な性能低下といった人間らしい特徴をうまく説明する一方、演繹的推論の説明では逆に分が悪くなる。両者の対立は、深層学習の登場によってなお決着を見ていない。","さらに1990年代以降、認知を脳内の情報処理に閉じ込めず、身体や環境との相互作用として捉え直す身体化された認知・エナクティヴィズムの潮流が現れる。紙と鉛筆で筆算するように、道具や環境を使うこと自体が思考の一部だとする発想は、AI研究に「何を計算機の中で行うべきか」という問いを投げかける。"],"highlight":"認知を脳内の記号操作や重みパターンに閉じ込めるか、身体と環境にまで開くかという対立が、AI研究のアーキテクチャ選択そのものを左右してきた。","quote":{"text":"AI研究者は、「コンピュータ内部で行わなければならないことは何なのか」を常に問わなければならないのである。","note":"反表象主義の議論が示唆する、AI設計への教訓として章末近くで述べられる一文。"},"reading_guide":[{"title":"考える脳・考えない脳：心と知識の哲学","author":"信原幸弘","note":"計算主義とコネクショニズムの論争を軸にした認知科学の哲学入門書。"},{"title":"認知哲学：脳科学から心の哲学へ","author":"ポール・M・チャーチランド","note":"コネクショニズム擁護の立場から書かれた代表的著作。"},{"title":"現れる存在：脳と身体と世界の再統合","author":"アンディ・クラーク","note":"身体化された認知・拡張された認知の考え方を広く紹介する一冊。"}],"sections":["8.1 AIと認知科学","8.2 計算主義","8.3 コネクショニズム","8.4 認知に関する新たな見方"],"part":"哲学","question":"AI を作ろうとする試みは、人間の心や知能についての理解をいかに深めてきたのか？","theme":"AI 研究と認知科学が相互に影響しながら発展してきた歴史を通じ、心と知能をどう理解するかの視点の変化を示す。"},{"number":9,"title":"AI は意識を持てるか？","digest":["心の状態は経験と思考に大別される。AI研究がこれまで扱ってきたのは主に思考の領域だが、人間に近づけるにはもう一つの領域、すなわち痛みや色の見えといった現象的意識を持たせられるかが問われる。この問いを支える心身問題では、心と物を別種の実体とみなす二元論に対し、行動主義・心脳同一説を経て機能主義が有力な物的一元論として位置づけられてきた。","しかし機能主義がうまく捉えられないのがクオリアである。逆転クオリアや哲学的ゾンビといった思考実験は、因果的機能がまったく同じでも意識のあり方は異なりうることを示唆し、意識の自然化を阻む意識のハードプロブレムとして立ちはだかる。この困難ゆえに、AIが現象的意識を持ちうるかへの明確な答えは今のところ存在しない。","一方で意識がAIにとって不要というわけでもない。強化学習における報酬のように、意識的経験は生物が汎用的に学習するための手がかりとして機能してきたと考えられ、痛みを感じるかもしれないAIをどう道徳的に扱うかという新しい問いも生まれている。"],"highlight":"意識のハードプロブレムが解けない限り、AIが意識を持つかどうかは原理的に判定不能でありながら、その可能性を無視することもまた許されない。","quote":{"text":"現象的意識は、因果的機能に加えてクオリアを伴うものなのである。","note":"機能主義では説明しきれない意識の側面を指す一文。"},"reading_guide":[{"title":"心の哲学入門","author":"金杉武司","note":"心身問題を中心に心の哲学の主要理論を整理した入門書。"},{"title":"ぼくらが原子の集まりなら、なぜ痛みや悲しみを感じるのだろう：意識のハード・プロブレムに挑む","author":"鈴木貴之","note":"ハードプロブレムの論点と表象を軸にした解決の試みを扱う。"},{"title":"脳のなかの幽霊","author":"V・S・ラマチャンドラン、サンドラ・ブレイクスリー","note":"幻肢痛などの症例から脳と意識の関係に迫る一冊。"}],"sections":["9.1 意識とは何か？","9.2 哲学における意識の問題","9.3 AIは意識を持てるか？","9.4 AIに意識は必要か？"],"part":"哲学","question":"AI が人間のような意識を持つことは原理的に可能であり、その判定基準は何であるのか？","theme":"意識という哲学的難問を前に、AI が意識を持つことは可能か、そもそも意識とは何かという根本的問いに向き合う。"},{"number":10,"title":"AI は感情を持てるか？","digest":["従来のAI研究が主に取り組んできたのは、感情そのものではなく感情の表出と認識、いわゆるアフェクティブコンピューティングだった。心理学における感情理論は、身体変化が先か感情が先かをめぐって中枢起源説・末梢起源説・二要因説が対立し、近年ではコアアフェクトの概念化として感情を捉える構成主義的感情理論も登場している。","哲学の伝統では理性と感情はしばしば対置され、ストア派やカントは理性を重視したが、アリストテレスは有徳な行為に感情が不可欠だと考えた。神経科学者ダマシオの身体的マーカー説は、感情が状況の価値を身体感覚として伝え意思決定を支えることを実証的に示し、感情を軽視できない理由を与えている。","二重過程理論に照らせば、感情は素早く働くシステム1の核心をなす。AIにこの仕組みが必要かは自明ではないが、身体を持ち環境と相互作用する自律型ロボットにおいては、内受容感覚と連動する感情が行動の動的な調整に本質的な役割を果たしうると論じられている。"],"highlight":"感情とは状況の価値を身体を通じて伝える仕組みであり、AIに感情を持たせられるかは、AIに身体を持たせられるかという問いと分かちがたく結びついている。","quote":{"text":"AIの意識は、AIアライメントの問題を解決するヒントになるかもしれない","note":"第9章末で示された論点が、感情の議論とも響き合う形で言及される。"},"reading_guide":[{"title":"感情心理学・入門 改訂版","author":"大平英樹（編）","note":"古典的理論から近年の研究までを概観する感情心理学の入門書。"},{"title":"デカルトの誤り：情動、理性、人間の脳","author":"アントニオ・R・ダマシオ","note":"身体的マーカー説の根拠となる研究をまとめた一冊。"},{"title":"情動はこうしてつくられる：脳の隠れた働きと構成主義的情動理論","author":"リサ・フェルドマン・バレット","note":"基本感情理論を批判し予測符号化から感情を捉え直す。"},{"title":"ファスト＆スロー：あなたの意思はどのように決まるか？ 上・下","author":"ダニエル・カーネマン","note":"二重過程理論の観点から人間の意思決定を論じた行動経済学の代表作。"},{"title":"モラル・トライブズ：共存の道徳哲学へ 上・下","author":"ジョシュア・グリーン","note":"感情に基づく道徳的判断の信頼性を批判的に検討する。"}],"sections":["10.1 人間とAIにおける感情","10.2 感情の心理学","10.3 感情の哲学","10.4 AIに感情は必要か？"],"part":"哲学","question":"感情は知能や決定にとって本質的な役割を果たすもので、AI には感情が必要なのか？","theme":"感情の心理学的・哲学的本質を検討しながら、AI やロボットが感情を持つ、あるいは感情的に機能することの意味を問う。"},{"number":11,"title":"AIは「人間」になれるか？","digest":["私たちの社会の一員、すなわち人格として扱われるものとそうでないものの間には、哲学的に重要な線引きがある。デネットの志向的スタンス論やマインドリーディング能力、規範性の理解といった条件を手がかりに検討すると、AIが人格の条件を原理的に満たすことは不可能ではないとわかる。","しかし人格をAIに与えるべきかは別の問題である。私たちは強いマインドリーディング傾向ゆえに単純なプログラムにさえ心を読み込んでしまい、AIを過大評価する危険がある。著者らは、AIを自律的な主体として位置づける道と、人間のための道具として位置づける道という二つのあり方を対比しつつ、当面は道具としてのAIの活用を優先すべきだと論じる。","とはいえ現実のAIやロボットとの関係は、主体でも道具でもない第三の様態を帯びつつある。法人格の議論や記号創発システムの発想は、人と物という単純な二分法を超えた、新しい種類の関係性をどうデザインするかという実践的な課題を私たちに突きつけている。"],"highlight":"AIを人格として遇するかどうかは技術的可能性の問題であると同時に、私たちがAIとの間にどのような関係性を望むのかという設計上の選択の問題である。","quote":{"text":"AIやロボットが記号創発システムに継続的に参画できるようになることこそ、それらが私たちの社会の一員となるうえで本質的なことなのである。","note":"谷口忠大が提唱する記号創発システムの考え方に基づく章末近くの一文。"},"reading_guide":[{"title":"人工知能とどうつきあうか：哲学から考える","author":"鈴木貴之（編著）","note":"主体としてのAIと道具としてのAIという対比を軸にした論文集。"},{"title":"人工知能の哲学入門","author":"鈴木貴之","note":"本書と対をなす、AIがなぜ哲学的に興味深いかを論じる入門書。"},{"title":"誰のためのデザイン？：認知科学者のデザイン原論 増補・改訂版","author":"D・A・ノーマン","note":"認知科学の知見に基づく人工物デザイン論の古典。"}],"sections":["11.1 私たちとともに生きるロボット","11.2 人格としてのAI","11.3 関係性のデザイン"],"part":"哲学","question":"機械に人間性を投影するとき、私たちは何を求めており、どのような関係を望んでいるのか？","theme":"AI やロボットが単なる道具ではなく、人間のような『人格』や『他者』として認識される場合の倫理的・実践的問題を扱う。"},{"number":12,"title":"AI ガバナンス","digest":["AIを社会に受け入れるには、個人の心掛けを超えた組織・社会レベルの舵取り、すなわちAIガバナンスが欠かせない。技術による対応と法制度・社会規範による対応は補完し合う社会―技術的な問題であり、国際・国・業界・企業といった複数の階層でルール形成が進められている。","AIガバナンスには他の技術にない三つの難しさがある。技術の変化が速すぎて従来型の立法が追いつかないこと、影響の範囲が広くマルチステークホルダーでの調整が必要なこと、そして自動運転の責任論に見られるように、AIの浸透自体が法や倫理が前提としてきた「個人の意思と責任」という基礎概念を揺るがすことである。","変化の速さに対応するため、ゴール設定と現場運用を二重ループで回すアジャイルガバナンスという考え方が提唱されている。他方で、巨大テック企業が技術の方向性を左右するビジョン寡頭制の懸念もあり、一人一人が声を上げる回路をいかに確保するかが問われている。"],"highlight":"AIガバナンスの本質的な難しさは規制の速度不足だけでなく、AIの浸透そのものが法や責任という近代社会の基礎概念を揺るがしている点にある。","quote":{"text":"技術ガバナンスはけっして技術の普及を遅らせるものではなく、むしろ社会による受容を促す役割を持つ","note":"自動車の安全技術と法制度の例を踏まえて示される、技術ガバナンスの基本的な考え方。"},"reading_guide":[{"title":"AI ガバナンス入門：リスクマネジメントから社会設計まで","author":"羽深宏樹","note":"アジャイルガバナンスの議論にも携わる著者によるAIガバナンスの概説書。"},{"title":"AI 社会の歩き方：人工知能とどう付き合うか","author":"江間有沙","note":"科学技術社会論の立場から書かれたAIと社会に関する早期の入門書。"},{"title":"ロボット・AI と法","author":"弥永真生・宍戸常寿（編）","note":"法学研究者12名によるAI・ロボットの法的課題を扱うオムニバス書。"}],"sections":["12.1 AI時代の技術ガバナンス","12.2 技術の変化の速さへの対応","12.3 影響の広さへの対応","12.4 価値観や前提の変化"],"part":"社会","question":"技術の発展速度を超えて、社会はいかにして AI への適切な規制と方向づけを行うことができるか？","theme":"急速に進展する AI 技術に対し、法制度、倫理規範、社会的価値観がいかに対応し、ガバナンスを構築すべきかを論じる。"},{"number":13,"title":"未来のAI社会","digest":["AIをめぐる議論にはしばしばディストピア的な語り口が伴う。本章は「AIが制御不能になる」「AIが職を奪う」「AIが民主主義を脅かす」という三つの脅威論を取り上げ、その根拠と限界を吟味する。AGI・ASIという概念自体、論者によって定義が大きく異なり、到来時期の予測も経験則の外挿にすぎないことがまず確認される。","コントロール喪失問題は、AIが意図的に反抗せずとも目的の最適化だけで人間の意図とずれた行動を生みうるという点で無視できない一方、その現実味はエージェント型AIがどこまで実用化されるかに依存する。雇用についても、AIが代替するのは職業そのものではなくタスクの一部であることが多く、将棋や科学研究の例が示すように、AIは既存の営みを置き換えるというより「ゲームそのものを変質させる」形で作用する。","民主主義への懸念は、個別化された情報操作による社会の分極化と、データにもとづく意思決定への傾斜による民主主義自体の魅力低下という二つの経路に整理できる。同時に、熟議を支援するデジタル民主主義の試みも各地で進んでおり、AIは分断の力にも協働の力にもなりうる両義的な存在として描かれる。"],"highlight":"AIをめぐる脅威論の多くは特定の文化圏・立場が紡いだ一つの物語にすぎず、AIが職業ではなくタスクを、民主主義の脅威にも支援にもなりうる両義的な技術であることを見誤ってはならない。","quote":{"text":"AIが個人の仕事を代替していくというよりは「ゲームをそのように作り変える」という人間社会としての意図的な選択としての側面がある。","note":"将棋や科学研究の変質を踏まえた、AIと雇用に関する章の結論部分。"},"reading_guide":[{"title":"スーパーインテリジェンス：超絶AIと人類の命運","author":"ニック・ボストロム","note":"AI脅威論を広く浸透させた影響力の大きい一冊。"},{"title":"人間機械論：人間の人間的な利用 第2版・新装版","author":"ノーバート・ウィーナー","note":"サイバネティクスの提唱者による、知的機械の社会的影響への早期の考察。"},{"title":"機械カニバリズム：人間なきあとの人類学へ","author":"久保明教","note":"将棋ソフトとプロ棋士の関係などから人と機械のかかわりを人類学的に分析する。"}],"sections":["13.1 AIをめぐるディストピア論","13.2 AGI/ASIというビジョン","13.3 AIは制御不能になるのか","13.4 AIは職を奪うのか","13.5 AIは民主主義を脅かすのか"],"part":"社会","question":"AI の未来に関する予測やビジョンは、どの程度根拠があり、われわれはどう向き合うべきか？","theme":"AI の未来に関する複数の想像（ディストピア、汎用 AI、制御不能性、雇用喪失など）を批判的に検討し、その根拠と盲点を明らかにする。"},{"number":14,"title":"私たちとAI","digest":["本書全体を締めくくる終章は、AI技術の進化が半導体などの計算資源の増大に支えられてきたことを振り返りつつ、生成AIの次の展開として身体性を伴うフィジカルAIへの回帰を指摘する。AIという新しい環境のもとで、既存の制度もまた人工的な構築物にすぎないという視点から、私たちが主体的に社会を設計し直す必要性が説かれる。","AIを問うことは人間を問い直すことでもある。「人間にしかできないこと」を特別視してきた知能観は、論理や言語処理でも人間を追い上げるAIの登場によって揺らぎつつあり、著者らは脳内の情報処理だけでなく身体的なダイナミクスや社会的な集合知性まで含めた四重過程モデル（システム0/1/2/3）を、AI時代の知能を捉え直す視座として提示する。","最終節では、AI社会のデザイナーとなるための心構えとして、AIの限界と可能性を自ら確かめる探求者であること、タスクの実装をAIに委ねつつ目的やルールを構想する設計者であること、そして当たり前とされる価値のフレーム自体を問い直す哲学者であることの三つが提案され、問い続ける姿勢こそが未来を生きる羅針盤になると結ばれる。"],"highlight":"AIという鏡を通して人間そのものを問い直し、一人一人が探求者・設計者・哲学者として問い続ける姿勢こそが、AIと共生する社会をデザインする力になる。","quote":{"text":"AIという鏡は、単に便利な未来を映し出すだけではない。それは、私たち自身が「人間とは何か」を深く見つめ直すための、またとない機会を提供してくれる。","note":"第14章「AIを通して『人間』を再発見する」の結びに近い一節。"},"reading_guide":[],"sections":["14.1 AI技術のこれから","14.2 AIを通して「人間」を再発見する","14.3 AI社会のデザイナーになる","14.4 おわりに"],"part":"社会と哲学","question":"AI との共存時代に、私たちは人間と社会の本質をいかに再定義し、主体的に未来を構想すべきか？","theme":"本書全体を総括し、AI という存在を通じて人間と社会の本質を再考し、主体的な AI 社会設計の重要性を強調する。"}],"keywords":[{"term":"機械学習","en":"machine learning","gloss":"データのパターンから規則性を自動的に学習し、未知のデータに対する予測や判断を行うアルゴリズム技術の総称。","chapter":4,"yomi":"きかいがくしゅう"},{"term":"深層学習","en":"deep learning","gloss":"多層に積み重ねたニューラルネットワークを用いる機械学習の手法で、画像認識や自然言語処理など複雑なパターン認識を実現する。","chapter":5,"yomi":"しんそうがくしゅう"},{"term":"ニューラルネットワーク","en":"neural network","gloss":"脳の神経細胞の構造に着想を得た計算モデルで、多数の単純な計算単位（ニューロン）を層状に接続し、相互作用を通じて学習と推論を行う。","chapter":5,"yomi":"にゅーらるねっとわーく"},{"term":"大規模言語モデル","en":"large language model (LLM)","gloss":"テキストデータの統計的な規則性を学習した深層学習モデルで、次の単語を予測することで自然な文章生成を実現し、ChatGPT などの基盤となる。","chapter":6,"yomi":"だいきぼげんごもでる"},{"term":"生成 AI","en":"generative AI","gloss":"テキスト、画像、音声などを新たに生成することができる AI システムの総称で、ユーザーのプロンプト入力に応じて出力を生成する。","chapter":1,"yomi":"せいせいえーあい"},{"term":"自然言語処理","en":"natural language processing (NLP)","gloss":"人間が使用する自然言語（日本語、英語など）をコンピュータが理解・生成・変換するための技術分野の総称。","chapter":6,"yomi":"しぜんげんごしょり"},{"term":"教師あり学習","en":"supervised learning","gloss":"正解ラベルが付与されたデータを用いて機械学習モデルを訓練する手法で、分類や回帰など教師からの指導に基づいて学習する。","chapter":4,"yomi":"きょうしありがくしゅう"},{"term":"強化学習","en":"reinforcement learning","gloss":"エージェントが環境との相互作用を通じて報酬・罰を学習信号として、試行錯誤により最適な行動戦略を習得する機械学習の手法。","chapter":4,"yomi":"きょうかがくしゅう"},{"term":"ロボティクス","en":"robotics","gloss":"機械的な身体と知能を持つロボットの設計・制御・学習に関する技術分野で、実世界の物理的課題への対応能力が求められる。","chapter":7,"yomi":"ろぼてぃくす"},{"term":"コンピュータビジョン","en":"computer vision","gloss":"画像や動画などの視覚情報をコンピュータが認識・分析する技術で、物体検出、顔認識、画像生成などの応用がある。","chapter":5,"yomi":"こんぴゅーたびじょん"},{"term":"トランスフォーマー","en":"transformer","gloss":"注意機構を用いたニューラルネットワークの深層学習アーキテクチャで、長距離の依存関係を効率的に学習でき、大規模言語モデルの主流になっている。","chapter":6,"yomi":"とらんすふぉーまー"},{"term":"フレーム問題","en":"frame problem","gloss":"知識表現型の AI システムが、問題解決に関連する情報を無限の可能性の中から自動的に選別することの困難さを指す哲学的課題。","chapter":3,"yomi":"ふれーむもんだい"},{"term":"ハルシネーション","en":"hallucination","gloss":"生成 AI が事実に基づかない、あるいは根拠のない内容を生成してしまう現象で、信頼性と精度の重要な課題である。","chapter":1,"yomi":"はるしねーしょん"},{"term":"バイアス","en":"bias","gloss":"機械学習モデルが学習データに含まれる偏りを学習し、実世界で不公平な予測や差別的な判断をもたらす問題。","chapter":1,"yomi":"ばいあす"},{"term":"黒箱性","en":"black box","gloss":"深層学習のような複雑なモデルが、入力から出力への変換過程が人間に理解しにくい特性を持つこと。","chapter":5,"yomi":"くろばこせい"},{"term":"ブレインストーミング","en":"brainstorming","gloss":"複数の人または対話者がアイデアを自由に出し合う方法で、生成 AI も創造的な思考の相談相手として活用される。","chapter":0,"yomi":"ぶれいんすとーみんぐ"},{"term":"プロンプト","en":"prompt","gloss":"生成 AI に与える指示や質問を含む自然言語入力で、出力の質は プロンプトの書き方に大きく依存する。","chapter":1,"yomi":"ぷろんぷと"},{"term":"意識","en":"consciousness","gloss":"主観的な経験や現象的意識（クオリア）を指し、何かを感じることの本質的な性質。AI が意識を持つかは哲学的に根本的な問題である。","chapter":9,"yomi":"いしき"},{"term":"クオリア","en":"qualia","gloss":"赤色を見たときの『赤さ』のような、主観的で個人的な経験の本質的な性質で、これを他者に説明することは困難である。","chapter":9,"yomi":"くおりあ"},{"term":"中国語の部屋","en":"Chinese room argument","gloss":"哲学者ジョン・サールが提唱した思考実験で、形式的な記号操作だけでは本当の理解には至らないことを示唆する。","chapter":3,"yomi":"ちゅうごくごのへや"},{"term":"感情","en":"emotion","gloss":"喜怒哀楽などの情動体験で、生理的変化と認知的評価により生じ、人間の意思決定と行動に重要な役割を果たす。","chapter":10,"yomi":"かんじょう"},{"term":"チューリングテスト","en":"Turing test","gloss":"コンピュータが人間と区別できないほど自然な会話ができるかで知能を測定する提案で、AI の初期段階での重要な概念である。","chapter":2,"yomi":"ちゅーりんぐてすと"},{"term":"機能主義","en":"functionalism","gloss":"心や意識を物理的な実装ではなく、入力に対する出力の機能的な振る舞いで定義する哲学的立場。","chapter":2,"yomi":"きのうしゅぎ"},{"term":"心身問題","en":"mind-body problem","gloss":"物質的な脳と非物質的と思われる心・意識の関係をいかに説明するかの古典的な哲学的問題。","chapter":8,"yomi":"しんしんもんだい"},{"term":"計算主義","en":"computationalism","gloss":"心と知能が本質的に計算過程であるという哲学的立場で、AI 研究の理論的基礎となっている。","chapter":8,"yomi":"けいさんしゅぎ"},{"term":"コネクショニズム","en":"connectionism","gloss":"ニューラルネットワークのような接続主義的な計算モデルで、分散表現と並列処理により古典的な記号主義の限界を克服する。","chapter":8,"yomi":"こねくしょにずむ"},{"term":"人格","en":"personhood","gloss":"法的・倫理的・社会的に『人間』としての地位や権利を持つ存在の性質で、AI やロボットに対する扱いに影響する重要な概念。","chapter":11,"yomi":"じんかく"},{"term":"AI 倫理","en":"AI ethics","gloss":"AI システムの開発・運用が社会にもたらす倫理的課題や価値観の衝突を検討し、責任ある AI の実現を目指す学問分野。","chapter":12,"yomi":"えーあいりんり"},{"term":"AI ガバナンス","en":"AI governance","gloss":"政府、企業、市民が協働して AI の発展と利用を規制・指導するための制度的・政策的枠組み。","chapter":12,"yomi":"えーあいがばなんす"},{"term":"技術的特異点","en":"technological singularity","gloss":"AI が人間を超える知能を獲得し、その先の未来が予測不可能になる想定上の転換点を指す概念。","chapter":13,"yomi":"ぎじゅつてきとくいてん"},{"term":"汎用人工知能","en":"Artificial General Intelligence (AGI)","gloss":"人間並みのあらゆる知的タスクを処理できる仮想的な AI システムで、現実にはまだ実現していない。","chapter":13,"yomi":"はんようじんこうちのう"},{"term":"ディストピア","en":"dystopia","gloss":"AI の発展によって社会が悪化する未来シナリオで、失業、支配、民主主義の崩壊などが想定される。","chapter":13,"yomi":"でぃすとぴあ"},{"term":"フィルターバブル","en":"filter bubble","gloss":"推薦アルゴリズムがユーザーの好みに基づいて情報を選別し、特定の視点のみを強化する現象。","chapter":1,"yomi":"ふぃるたーばぶる"},{"term":"アルゴリズム的公平性","en":"algorithmic fairness","gloss":"機械学習モデルが全ての人に公平な結果をもたらすべきという原則で、バイアス排除の課題と関連する。","chapter":12,"yomi":"あるごりずむてきこうへいせい"},{"term":"透明性","en":"transparency","gloss":"AI システムの意思決定プロセスが人間に理解可能であるべきという原則で、説明責任と関連する。","chapter":12,"yomi":"とうめいせい"},{"term":"認知科学","en":"cognitive science","gloss":"心や知能、認知プロセスを多角的に研究する学際領域で、AI、心理学、哲学、神経科学の融合である。","chapter":8,"yomi":"にんちかがく"},{"term":"エナクティヴィズム","en":"enactivism","gloss":"知能と認知は環境との相互作用を通じて身体的に実現されるという哲学的立場で、純粋な内部計算を否定する。","chapter":7,"yomi":"えなくてぃびずむ"},{"term":"アフォーダンス","en":"affordance","gloss":"環境が主体に対して直接的に提供する行動の可能性で、認知と身体の結合性を強調する概念。","chapter":7,"yomi":"あふぉーだんす"},{"term":"スタンス","en":"stance","gloss":"特定の観点や立場を取ることで、他者や環境に対する理解の仕方が変わる認知科学的な考え方。","chapter":11,"yomi":"すたんす"},{"term":"記号的 AI","en":"symbolic AI","gloss":"知識を形式的な記号として表現し、論理的な推論規則を適用する初期の AI 研究アプローチ。","chapter":3,"yomi":"きごうてきえーあい"},{"term":"物理記号システム仮説","en":"physical symbol system hypothesis","gloss":"思考や知能は形式的な記号操作によって実現されるという初期 AI 研究の基本的仮説。","chapter":3,"yomi":"ぶつりきごうしすてむかせつ"},{"term":"エキスパートシステム","en":"expert system","gloss":"専門家の知識を規則ベースで形式化し、特定分野の問題解決を行うシステムで、1980年代に活躍した。","chapter":3,"yomi":"えきすぱーとしすてむ"},{"term":"知識グラフ","en":"knowledge graph","gloss":"実体と関係を構造化して表現したデータベースで、セマンティック Web や AI の理解タスクに利用される。","chapter":2,"yomi":"ちしきぐらふ"},{"term":"シンギュラリティ","en":"singularity","gloss":"AI が人間知能を超え、その後の発展が予測不可能になる転換点を想定する概念で、議論が分かれている。","chapter":13,"yomi":"しんぎゅらりてぃ"},{"term":"モラベックのパラドックス","en":"Moravec's paradox","gloss":"高度な知識労働は簡単だが、単純な身体的作業が AI にとって難しいという直感に反する現象。","chapter":7,"yomi":"もらべっくのぱらどっくす"},{"term":"創発","en":"emergence","gloss":"単純な要素の組み合わせから、個々の要素にはない新たな性質や振る舞いが生じる現象。","chapter":5,"yomi":"そうはつ"},{"term":"データマイニング","en":"data mining","gloss":"大量のデータから隠れたパターンや知識を自動的に発見する技術で、ビジネス分析に多用される。","chapter":4,"yomi":"でーたまいにんぐ"},{"term":"推薦システム","en":"recommendation system","gloss":"ユーザーの過去の行動や嗜好から、今後興味を持つと予想される商品やコンテンツを自動提案するシステム。","chapter":1,"yomi":"すいせんしすてむ"},{"term":"ELSI","en":"ethical, legal and social issues","gloss":"新しい技術が社会にもたらす影響を、倫理的・法的・社会的という3つの側面から検討する考え方。AIのリスクを多面的に捉える枠組みとして本書で繰り返し参照される。","chapter":1,"yomi":"えるしー"},{"term":"ジェボンズのパラドックス","en":"Jevons' paradox","gloss":"資源利用の効率化が進むほど、かえって総利用量が増加してしまう現象。生成AIの電力消費が効率化にもかかわらず拡大し続ける背景として紹介される。","chapter":1,"yomi":"じぇぼんずのぱらどっくす"},{"term":"ランナウェイ・フィードバックループ","en":"runaway feedback loop","gloss":"AIの出力に含まれるバイアスが人間の利用や次世代モデルの訓練データを通じて増幅され、AIと社会が互いにバイアスを強化し合ってしまう悪循環。","chapter":1,"yomi":"らんなうぇいふぃーどばっくるーぷ"},{"term":"AI効果","en":"AI effect","gloss":"かつてAI技術と呼ばれていたものが社会に普及し当たり前になると、もはやAIとは呼ばれなくなる現象。カーナビの経路探索などが例に挙げられる。","chapter":2,"yomi":"えーあいこうか"},{"term":"第五世代コンピュータプロジェクト","en":"Fifth Generation Computer Project","gloss":"1980年代初頭に日本が国家事業として推進した並列計算機開発プロジェクト。記号的AIブームと時期を同じくし、多くの研究者を育てた。","chapter":2,"yomi":"だいごせだいこんぴゅーたぷろじぇくと"},{"term":"固いトークンと柔らかいトークン","en":"hard token / soft token","gloss":"記号的AIが扱う離散的で曖昧さのない情報単位と、生成AIが扱う文脈に応じて意味が変化する高次元ベクトルとしての情報単位を対比させた本書独自の整理。","chapter":2,"yomi":"かたいとーくんとやわらかいとーくん"},{"term":"知識獲得のボトルネック","en":"knowledge acquisition bottleneck","gloss":"専門家の持つ膨大で複雑な知識を、記号的AIが利用できる形で人手で与える作業がシステム開発全体を制約してしまう問題。","chapter":3,"yomi":"ちしきかくとくのぼとるねっく"},{"term":"記号接地問題","en":"symbol grounding problem","gloss":"記号的AIが操作する記号が、現実世界の対象や現象とどのように結びつくのかを説明できないという根本的な課題。","chapter":3,"yomi":"きごうせっちもんだい"},{"term":"ウィノグラード・スキーマ","en":"Winograd schema","gloss":"文中の指示代名詞が何を指すかを問う問題で、正しく答えるには常識的な知識が必要になることを示す代表的なテストとして紹介される。","chapter":3,"yomi":"うぃのぐらーどすきーま"},{"term":"暗黙知","en":"tacit knowledge","gloss":"マイケル・ポランニーが提唱した、言語化された規則（形式知）に還元できない身体的な習慣や感覚に基づく知識。ドレイファスの記号的AI批判の背景にある概念。","chapter":3,"yomi":"あんもくち"},{"term":"汎化性能","en":"generalization performance","gloss":"訓練データに含まれない未知のデータに対しても機械学習モデルが正しく対応できる能力。過学習と対をなす機械学習評価の中心概念。","chapter":4,"yomi":"はんかせいのう"},{"term":"特徴量エンジニアリング","en":"feature engineering","gloss":"機械学習の性能を左右する入力特徴を専門知識に基づいて設計・抽出する工程。深層学習以前のパターン認識を支えたが、属人的で開発コストの高い工程でもあった。","chapter":4,"yomi":"とくちょうりょうえんじにありんぐ"},{"term":"自己教師あり学習","en":"self-supervised learning","gloss":"人間が正解ラベルを付けなくても、データ自身から疑似的な問題を自動生成して学習する手法。基盤モデルを支える鍵となる技術。","chapter":5,"yomi":"じこきょうしありがくしゅう"},{"term":"基盤モデル","en":"foundation model","gloss":"膨大で多様なデータを自己教師あり学習などで事前学習した大規模モデルで、特定のタスクに限定されない汎用性と適応性を備える。","chapter":5,"yomi":"きばんもでる"},{"term":"end-to-end学習","en":"end-to-end learning","gloss":"入力データから最終的な出力までを1つのネットワークの中で一貫して学習する方式。人手による特徴設計を不要にした深層学習の中心的な考え方。","chapter":5,"yomi":"えんどつーえんどがくしゅう"},{"term":"AIアライメント","en":"AI alignment","gloss":"AIの振る舞いを人間の価値観や社会的利益に整合させる取り組みの総称。インストラクション・チューニングやRLHFなどの技術的手法を含む。","chapter":6,"yomi":"えーあいあらいめんと"},{"term":"Chain-of-Thought","en":"Chain-of-Thought (CoT)","gloss":"大規模言語モデルに中間的な思考ステップを明示的に生成させることで、複雑な推論の精度を高めるプロンプト設計手法。","chapter":6,"yomi":"ちぇーんおぶそーと"},{"term":"分布意味論","en":"distributional semantics","gloss":"単語の意味はその単語がどんな単語と一緒に使われるかによって決まるとする言語学の考え方。word2vecによる単語埋め込みの理論的背景となった。","chapter":6,"yomi":"ぶんぷいみろん"},{"term":"ジャギー・フロンティア","en":"jagged frontier","gloss":"生成AIの性能がタスクによって大きくばらつき、得意・不得意が予測しにくい凹凸を持つ様子を表す言葉。経営学者イーサン・モリックが提唱した。","chapter":1,"yomi":"じゃぎーふろんてぃあ"},{"term":"サブサンプションアーキテクチャ","en":"subsumption architecture","gloss":"ロボットの制御を単純な行動モジュールの階層として構成し、上位が下位を包摂する仕組みで環境に応じた複雑な振る舞いを生み出す設計手法。ブルックスが提案した。","chapter":7,"yomi":"さぶさんぷしょんあーきてくちゃ"},{"term":"形態による計算","en":"morphological computation","gloss":"身体の物理的な構造や特性そのものが、あたかも計算を行っているかのように望ましい振る舞いを生み出す仕組み。受動歩行ロボットに象徴される。","chapter":7,"yomi":"けいたいによるけいさん"},{"term":"Sim2Realギャップ","en":"Sim2Real gap","gloss":"シミュレーション環境で学習した行動方策を実世界のロボットに適用する際に生じる性能差。ロボット強化学習の実用化を長く阻んでいた課題。","chapter":7,"yomi":"しむつーりあるぎゃっぷ"},{"term":"分散表象","en":"distributed representation","gloss":"ニューラルネットワークにおいて、一つの知識や思考が多数のユニットの重みパターン全体によって表される表象形式。個別的な局所表象と対比される。","chapter":8,"yomi":"ぶんさんひょうしょう"},{"term":"身体化された認知","en":"embodied cognition","gloss":"認知を脳内の情報処理だけに閉じ込めず、身体や環境との相互作用を通じて成立するものとして捉える考え方。拡張された認知とも呼ばれる。","chapter":8,"yomi":"しんたいかされたにんち"},{"term":"思考の体系性と生産性","en":"systematicity and productivity of thought","gloss":"ある思考を持てる者は関連する別の思考も持ちうること（体系性）、また原理的に無限に多くの思考を組み立てられること（生産性）を指す、計算主義が重視した思考の特徴。","chapter":8,"yomi":"しこうのたいけいせいとせいさんせい"},{"term":"反表象主義","en":"anti-representationalism","gloss":"認知は表象を用いた脳内の情報処理であるという表象主義の前提そのものを否定する立場。ロボティクスや力学系理論に由来する複数のバリエーションがある。","chapter":8,"yomi":"はんひょうしょうしゅぎ"},{"term":"意識のハードプロブレム","en":"hard problem of consciousness","gloss":"現象的意識（クオリアを伴う主観的経験）を自然科学的な見方のもとで説明することの根本的な困難さを指す哲学の問題。","chapter":9,"yomi":"いしきのはーどぷろぶれむ"},{"term":"現象的意識","en":"phenomenal consciousness","gloss":"痛みや色の見えなど、独特の主観的な感じを伴う意識のあり方。自覚を意味する反省的意識と区別される。","chapter":9,"yomi":"げんしょうてきいしき"},{"term":"哲学的ゾンビ","en":"philosophical zombie","gloss":"外見も行動も通常の人間とまったく同じでありながら、クオリアをまったく経験しない存在を想定する思考実験。意識の自然化への懐疑を支える論拠の一つ。","chapter":9,"yomi":"てつがくてきぞんび"},{"term":"自由意志","en":"free will","gloss":"自らの行動を自ら選択する能力。因果的決定論と両立可能かをめぐって、リバタリアニズム・強硬な決定論・両立論という立場が対立してきた。","chapter":9,"yomi":"じゆういし"},{"term":"アフェクティブコンピューティング","en":"affective computing","gloss":"人間の感情をコンピュータが認識・理解・表現することを目的とする技術分野。感情そのものの実現ではなく表出と認識を主眼とする。","chapter":10,"yomi":"あふぇくてぃぶこんぴゅーてぃんぐ"},{"term":"身体的マーカー説","en":"somatic marker hypothesis","gloss":"神経科学者ダマシオが提唱した理論で、感情とは身体反応を通じて状況の価値を私たちに伝える身体的マーカーであるとする考え方。","chapter":10,"yomi":"しんたいてきまーかーせつ"},{"term":"二重過程理論","en":"dual-process theory","gloss":"人間の認知は、素早く自動的なシステム1と、遅く熟慮的なシステム2という二つの過程から成り立つとする理論。感情はシステム1の重要な構成要素とされる。","chapter":10,"yomi":"にじゅうかていりろん"},{"term":"徳倫理学","en":"virtue ethics","gloss":"アリストテレスを源流とし、規則の適用ではなく、有徳な人がしかるべき状況でしかるべき感情を抱いて行動することに道徳的判断の基盤を見る倫理学の立場。","chapter":10,"yomi":"とくりんりがく"},{"term":"志向的スタンス","en":"intentional stance","gloss":"デネットが提唱した概念で、あるシステムを信念や欲求を持つ合理的な行為者とみなして、その振る舞いを理解しようとする態度のこと。","chapter":11,"yomi":"しこうてきすたんす"},{"term":"マインドリーディング","en":"mindreading","gloss":"他者の行動や発話を手がかりにその人の心の状態を理解し、行動を予測する人間の認知能力。人格の条件の一つとされる。","chapter":11,"yomi":"まいんどりーでぃんぐ"},{"term":"アジャイルガバナンス","en":"agile governance","gloss":"ゴール設定を見直す外側のループと現場での運用・評価を回す内側のループを同時に回しながら、変化の速い技術に機敏に対応するガバナンスの考え方。","chapter":12,"yomi":"あじゃいるがばなんす"},{"term":"コリングリッジのジレンマ","en":"Collingridge dilemma","gloss":"新しい技術への対応は、技術が未成熟な段階では情報が少なく効果的なルール作りが難しく、普及した後ではリスク回避のコストが膨大になるという二律背反を指す。","chapter":12,"yomi":"こりんぐりっじのじれんま"},{"term":"コントロール喪失問題","en":"loss of control problem","gloss":"自律性を増したAIが、与えられた目的を忠実に最適化する過程で人間の意図とは異なる行動を選び、人間の制御が及ばなくなるリスク。AIアライメント問題とも呼ばれる。","chapter":13,"yomi":"こんとろーるそうしつもんだい"},{"term":"分極化","en":"polarization","gloss":"社会が異なる立場や意見に沿って分かれ、合意や対話が困難になる現象。個別化された情報提示やフィルターバブルによって助長されると懸念される。","chapter":13,"yomi":"ぶんきょくか"},{"term":"デジタル民主主義","en":"digital democracy","gloss":"AIを含むデジタル技術を活用して、多様な情報への接触機会の拡大や熟議の支援など、民主主義のプロセスを補強しようとする取り組みの総称。","chapter":13,"yomi":"でじたるみんしゅしゅぎ"}]};

const KANA_ROWS = [
  {label:"あ", kana:"あいうえお"},
  {label:"か", kana:"かきくけこがぎぐげご"},
  {label:"さ", kana:"さしすせそざじずぜぞ"},
  {label:"た", kana:"たちつてとだぢづでど"},
  {label:"な", kana:"なにぬねの"},
  {label:"は", kana:"はひふへほばびぶべぼぱぴぷぺぽ"},
  {label:"ま", kana:"まみむめも"},
  {label:"や", kana:"やゆよ"},
  {label:"ら", kana:"らりるれろ"},
  {label:"わ", kana:"わをん"}
];
function kanaRowOf(yomi){
  const c0 = (yomi||"")[0] || "";
  for(const row of KANA_ROWS){
    if(row.kana.includes(c0)) return row.label;
  }
  return "他";
}

function viewLexicon(state){
  const q = (state.q||"").trim().toLowerCase();
  const chFilter = state.ch;
  let items = DATA.keywords.slice().sort((a,b)=>(a.yomi||"").localeCompare(b.yomi||"","ja"));
  if(q){
    items = items.filter(k=>
      k.term.toLowerCase().includes(q) ||
      (k.en||"").toLowerCase().includes(q) ||
      (k.yomi||"").toLowerCase().includes(q) ||
      (k.gloss||"").toLowerCase().includes(q)
    );
  }
  if(chFilter!==""&&chFilter!=null){
    items = items.filter(k=>String(k.chapter)===String(chFilter));
  }
  const chapterOptions = DATA.chapters.map(c=>`<option value="${c.number}">第${c.number}章　${esc(c.title)}</option>`).join("");

  const groups = [];
  let currentLabel = null, currentGroup = null;
  for(const k of items){
    const label = kanaRowOf(k.yomi);
    if(label!==currentLabel){
      currentLabel = label;
      currentGroup = {label, items:[]};
      groups.push(currentGroup);
    }
    currentGroup.items.push(k);
  }

  const grid = items.length ? `
    <div class="lexicon-grid">
      ${groups.map(g=>`
        <div class="lex-index-group">
          <h2 class="lex-index-head">${esc(g.label)}</h2>
          <div class="lex-item-grid">
            ${g.items.map(k=>`
              <div class="lex-item">
                <span class="lex-term">${esc(k.term)}</span><span class="lex-yomi">${esc(k.yomi||"")}</span><span class="lex-en">${esc(k.en||"")}</span>
                <p class="lex-gloss">${esc(k.gloss)}</p>
                <a class="lex-chapter-link" href="#/chapter/${k.chapter}">第${k.chapter}章へ →</a>
              </div>
            `).join("")}
          </div>
        </div>
      `).join("")}
    </div>` : `<div class="lex-empty">該当する用語が見つかりませんでした。</div>`;

  return `
  <div class="fade-in">
    <div class="lexicon-head">
      <span class="label">Lexicon</span>
      <h1 style="margin-top:0.8rem;">キーワード</h1>
      <p>本書に登場する用語を読み仮名の五十音順にまとめました。全${DATA.keywords.length}語。</p>
    </div>
    <div class="lexicon-controls">
      <input type="text" class="search-input" id="lex-search" placeholder="用語・英語・読みで検索" value="${esc(state.q||"")}">
      <select class="chapter-filter" id="lex-chapter">
        <option value="">すべての章</option>
        ${chapterOptions}
      </select>
      <span class="lexicon-count">${items.length} / ${DATA.keywords.length}</span>
    </div>
    ${grid}
  </div>`;
}

/* ===================== Router ===================== */
function parseHash(){
  let h = location.hash.replace(/^#/,"");
  if(h==="" || h==="/") return {view:"home"};
  if(h.startsWith("/chapter/")){
    const n = parseInt(h.split("/chapter/")[1], 10);
    if(!isNaN(n) && n>=0 && n<=14) return {view:"chapter", n};
    return {view:"notfound"};
  }
  if(h.startsWith("/guide")) return {view:"home"};
  if(h.startsWith("/lexicon")) return {view:"lexicon"};
  if(h.startsWith("/book")) return {view:"book"};
  return {view:"notfound"};
}

const lexState = {q:"", ch:""};

function render(){
  const route = parseHash();
  const app = document.getElementById("app");
  let html;
  switch(route.view){
    case "home": html = viewHome(); break;
    case "chapter": html = viewChapter(route.n) || view404(); break;
    case "lexicon": html = viewLexicon(lexState); break;
    case "book": html = viewBook(); break;
    default: html = view404();
  }
  app.innerHTML = html;
  window.scrollTo(0,0);
  closeOverlay();
  attachViewHandlers(route);
  updateProgressBar(route);
}

function attachViewHandlers(route){
  if(route.view==="lexicon"){
    const search = document.getElementById("lex-search");
    const chSel = document.getElementById("lex-chapter");
    if(search){
      search.addEventListener("input", e=>{
        lexState.q = e.target.value;
        rerenderLexiconOnly();
      });
      search.focus();
      search.setSelectionRange(search.value.length, search.value.length);
    }
    if(chSel){
      chSel.value = lexState.ch;
      chSel.addEventListener("change", e=>{
        lexState.ch = e.target.value;
        rerenderLexiconOnly();
      });
    }
  }
  // book: scroll to anchor author if present
  if(route.view==="book" && location.hash.includes("#", 1)){
    const parts = location.hash.split("#");
    const anchor = parts[2];
    if(anchor){
      const el = document.getElementById(anchor);
      if(el){ setTimeout(()=>el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto":"smooth", block:"start"}), 50); }
    }
  }
}

function rerenderLexiconOnly(){
  const app = document.getElementById("app");
  const scrollY = window.scrollY;
  app.innerHTML = viewLexicon(lexState);
  window.scrollTo(0, scrollY);
  attachViewHandlers({view:"lexicon"});
}

function updateProgressBar(route){
  const bar = document.getElementById("progress-bar");
  if(route.view!=="chapter"){ bar.style.width="0%"; bar.style.opacity="0"; return; }
  bar.style.opacity="1";
  const onScroll = ()=>{
    const h = document.documentElement;
    const scrolled = h.scrollTop;
    const height = h.scrollHeight - h.clientHeight;
    const pct = height>0 ? Math.min(100, (scrolled/height)*100) : 0;
    bar.style.width = pct+"%";
  };
  onScroll();
  window.onscroll = onScroll;
}
